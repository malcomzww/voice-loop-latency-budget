[project]
name = "voice-loop-latency-budget"
version = "0.1.0"
description = "A streaming ASR to LLM to TTS loop instrumented end-to-end, answering where the perceived latency actually lives."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
